# `restart: unless-stopped` en TODOS los servicios: sin esto, un reinicio del
# servidor (mantenimiento de Hetzner, actualización de kernel, corte de luz)
# dejaba el hotel entero caído hasta que alguien entrara por SSH a levantarlo
# a mano. Se usa `unless-stopped` y no `always` para que un `docker compose
# stop` deliberado durante mantenimiento siga respetándose.
#
# Va solo en producción: en desarrollo no se quiere que los contenedores
# revivan solos cada vez que arranca Docker Desktop.
services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    volumes: !override []
    ports: !override []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: runner
    volumes: !override []
    ports: !override []

  # Sitio público (apu-garden-lodge.com) — repo hermano, clonado al mismo
  # nivel que esta carpeta (ver README de despliegue).
  web:
    restart: unless-stopped
    build:
      context: ../apu-garden-lodge-web
      target: runner
    # RESEND_API_KEY / COMPLAINTS_EMAIL_TO: usados por el Libro de
    # Reclamaciones (app/api/libro-de-reclamaciones/route.ts en el repo del
    # sitio público) para enviar el reclamo por email — es un secreto de
    # runtime, no de build, así que va por env_file y NO por un ENV fijo en
    # el Dockerfile de ese repo (eso quedaría horneado en la imagen). Debe
    # existir en el .env de ESTE repo (Gestión), en el servidor.
    env_file: .env

  # nginx (dev) usa un config distinto en producción: agrega el server block
  # del sitio público y quita el bind-mount de código fuente. Cloudflare ya
  # termina HTTPS hacia el visitante (proxy activado, modo Flexible) — el
  # origen solo necesita servir HTTP en el puerto 80, sin certificados
  # propios que mantener.
  nginx:
    restart: unless-stopped
    volumes: !override
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      - backend
      - frontend
      - web
